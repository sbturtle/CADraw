name: Codex PR Review

on:
  pull_request:
    # edited는 대상(base) 브랜치를 바꾼 경우에만 리뷰합니다 (제목·본문 수정은 아래 resolve 조건에서 제외).
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # 재리뷰 대상이 아닌 댓글(PR 작성자가 아닌 사람, 봇)과 대상 브랜치 변경이 아닌 편집(제목·본문)으로 생긴 실행은
  # 별도 그룹으로 분리해 진행 중인 리뷰를 취소하지 않습니다.
  group: codex-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}${{ ((github.event.comment && !(github.event.comment.user.type == 'User' && github.event.comment.user.login == (github.event.issue.user.login || github.event.pull_request.user.login))) || (github.event.action == 'edited' && !github.event.changes.base)) && format('-skip-{0}', github.run_id) || (github.event_name != 'pull_request' && '-comments' || '') }}
  # 댓글은 별도 그룹이라 진행 중/대기 중 코드 실행을 취소하지 않습니다.
  # 같은 저장소의 단일 self-hosted runner에서 실행 중 리뷰 뒤에 대기합니다. 댓글끼리는 마지막 대기 실행이 의견을 함께 수집합니다.
  # 코드/대상 브랜치 변경은 기존 코드 실행만 대체합니다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    # PR 이벤트, 또는 열려 있는 PR에 PR 작성자 본인이 단 댓글(일반 댓글·코드 리뷰 댓글)일 때만 리뷰합니다.
    if: >-
      (
        github.event_name == 'pull_request' &&
        (github.event.action != 'edited' || github.event.changes.base != null) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event.comment.user.type == 'User' &&
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            github.event.comment.user.login == github.event.issue.user.login) ||
          (github.event_name == 'pull_request_review_comment' && github.event.pull_request &&
            github.event.pull_request.state == 'open' &&
            github.event.comment.user.login == github.event.pull_request.user.login)
        )
      )
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      draft: ${{ steps.pr.outputs.draft }}
      state: ${{ steps.pr.outputs.state }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve pull request context
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const pull_number = context.eventName === 'issue_comment'
              ? context.payload.issue.number
              : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number
            });
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo?.full_name ?? '');
            core.setOutput('draft', String(pr.draft));
            core.setOutput('state', pr.state);
            core.setOutput('number', String(pr.number));

  review:
    needs: resolve
    if: >-
      needs.resolve.outputs.state == 'open' &&
      needs.resolve.outputs.draft == 'false' &&
      needs.resolve.outputs.head_repo == github.repository
    runs-on: [self-hosted, Linux, X64, codex-review]
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
      BASE_REF: ${{ needs.resolve.outputs.base_ref }}
      # 대상 브랜치를 바꾼 이벤트(edited)면 이전 대상 브랜치 이름, 그 밖의 이벤트는 빈 값
      BASE_CHANGED_FROM: ${{ github.event.changes.base.ref.from }}
      HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      # 리뷰 로직·프롬프트·스키마·모델 설정은 러너 서버에서 관리합니다 (원본: sbturtle/codex-review-kit).
      CODEX_KIT: /opt/codex-review

    steps:
      - name: Read previous state and create this run's comment
        id: start
        uses: actions/github-script@v9
        with:
          script: return await require(`${process.env.CODEX_KIT}/lib/start.js`)({github, context, core});

      - name: Checkout PR HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tools and prepare inputs
        id: prepare
        shell: bash
        env:
          PRIOR_B64: ${{ steps.start.outputs.prior_b64 }}
        run: 'bash "$CODEX_KIT/bin/codex-review.sh" prepare'

      - name: Codex full-repository review
        id: codex
        continue-on-error: true
        shell: bash
        run: 'bash "$CODEX_KIT/bin/codex-review.sh" review'

      - name: Update only this run's comment and persist Blocking state
        if: ${{ always() && steps.start.outputs.comment_id != '' }}
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ steps.start.outputs.comment_id }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          WORKFLOW_CANCELLED: ${{ job.status == 'cancelled' }}
        with:
          script: return await require(`${process.env.CODEX_KIT}/lib/finish.js`)({github, context, core});

      - name: Cleanup worktree
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: 'bash "$CODEX_KIT/bin/codex-review.sh" cleanup'

      - name: Fail when Codex failed
        if: ${{ always() && !cancelled() && steps.start.outputs.comment_id != '' && steps.codex.outcome != 'success' }}
        shell: bash
        run: |
          echo 'Codex 또는 선행 리뷰 단계 실패'
          exit 1
