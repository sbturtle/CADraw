name: Codex PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # 재리뷰 대상이 아닌 댓글(PR 작성자가 아닌 사람, 봇)로 생긴 실행은 별도 그룹으로 분리해
  # 진행 중인 리뷰를 취소하지 않습니다.
  group: codex-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}${{ (github.event.comment && !(github.event.comment.user.type == 'User' && github.event.comment.user.login == (github.event.issue.user.login || github.event.pull_request.user.login))) && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  resolve:
    # PR 이벤트, 또는 PR 작성자 본인이 단 댓글(일반 댓글·코드 리뷰 댓글)일 때만 리뷰합니다.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event.comment.user.type == 'User' &&
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
            github.event.comment.user.login == github.event.issue.user.login) ||
          (github.event_name == 'pull_request_review_comment' && github.event.pull_request &&
            github.event.comment.user.login == github.event.pull_request.user.login)
        )
      )
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      draft: ${{ steps.pr.outputs.draft }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve pull request context
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const pull_number = context.eventName === 'issue_comment'
              ? context.payload.issue.number
              : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number
            });
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo?.full_name ?? '');
            core.setOutput('draft', String(pr.draft));
            core.setOutput('number', String(pr.number));

  review:
    needs: resolve
    if: >-
      needs.resolve.outputs.draft == 'false' &&
      needs.resolve.outputs.head_repo == github.repository
    runs-on: [self-hosted, Linux, X64, codex-review]
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
      HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      # 리뷰 로직·프롬프트·스키마·모델 설정은 러너 서버에서 관리합니다 (원본: sbturtle/codex-review-kit).
      CODEX_KIT: /opt/codex-review

    steps:
      - name: Read previous state and create this run's comment
        id: start
        uses: actions/github-script@v9
        with:
          script: return await require(`${process.env.CODEX_KIT}/lib/start.js`)({github, context, core});

      - name: Checkout PR HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tools and prepare inputs
        id: prepare
        shell: bash
        env:
          PRIOR_B64: ${{ steps.start.outputs.prior_b64 }}
        run: 'bash "$CODEX_KIT/bin/codex-review.sh" prepare'

      - name: Codex full-repository review
        id: codex
        continue-on-error: true
        shell: bash
        run: 'bash "$CODEX_KIT/bin/codex-review.sh" review'

      - name: Update only this run's comment and persist Blocking state
        if: ${{ always() && steps.start.outputs.comment_id != '' }}
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ steps.start.outputs.comment_id }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        with:
          script: return await require(`${process.env.CODEX_KIT}/lib/finish.js`)({github, context, core});

      - name: Cleanup worktree
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: 'bash "$CODEX_KIT/bin/codex-review.sh" cleanup'

      - name: Fail when Codex failed
        if: ${{ always() && steps.start.outputs.comment_id != '' && steps.codex.outcome != 'success' }}
        shell: bash
        run: |
          echo 'Codex 또는 선행 리뷰 단계 실패'
          exit 1
